<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Location Lens</title>
<style>
body{margin:0;background:#f4f7f3;color:#1b2a22;font:16px system-ui,sans-serif}main{max-width:980px;margin:36px auto;padding:28px;background:#fff;border:1px solid #d9e2d8;border-radius:18px}h1{margin:0;font-size:30px}.lede,p{color:#52665a}.form{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin:22px 0}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #c8d5ca}button{border:0;background:#166534;color:white;font-weight:700;cursor:pointer}button.secondary{background:#365847}.result{min-height:24px}.shortlist{display:none;margin:20px 0;padding:18px;border:1px solid #c8d5ca;border-radius:12px;background:#f7fbf7}.shortlist.visible{display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:14px;border:1px solid #d9e2d8;border-radius:10px;background:#fff}.score{font-size:26px;font-weight:800;color:#166534}@media(max-width:650px){main{margin:0;border:0;border-radius:0}.form,.cards{grid-template-columns:1fr}}
</style></head><body><main><div style="display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap"><div><h1>Location Lens</h1><p class="lede">Find promising U.S. business areas using Census demographics.</p></div><label>Business type<br><select id="business"><option>Cafe</option><option>Salon</option><option>Specialty retail</option></select></label></div><form id="lookup" class="form"><input id="address" required maxlength="100" placeholder="Enter a U.S. address"><button>Check local data</button><button type="button" class="secondary" id="maps">Search Google Maps</button></form><div id="result" class="result">Enter an address to view local Census data.</div><section id="shortlist" class="shortlist"><h2>30-mile opportunity shortlist</h2><p id="note"></p><div id="cards" class="cards"></div></section></main><script>
const form=document.querySelector('#lookup'),address=document.querySelector('#address'),result=document.querySelector('#result'),shortlist=document.querySelector('#shortlist'),note=document.querySelector('#note'),cards=document.querySelector('#cards');
const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}),number=new Intl.NumberFormat('en-US');
document.querySelector('#maps').addEventListener('click',()=>{const place=address.value.trim();if(!place){result.textContent='Enter an address first, then search Google Maps.';return}window.open('https://www.google.com/maps/search/'+encodeURIComponent('commercial space for lease near '+place),'_blank','noopener')});
form.addEventListener('submit',async e=>{e.preventDefault();const value=address.value.trim();if(!value)return;result.textContent='Looking up Census geography...';shortlist.classList.remove('visible');try{const response=await fetch('/.netlify/functions/census?address='+encodeURIComponent(value));const data=await response.json();if(!response.ok)throw Error(data.error||'Census data was unavailable for this location.');result.textContent=data.matchedAddress+' | '+data.name+' | Population '+number.format(data.population)+' | Median household income '+money.format(data.income)+' | Median age '+Number(data.age).toFixed(1)+'.';const base=Math.min(98,Math.max(55,Math.round(55+data.population/180+data.income/4200)));const areas=[['Northwest growth corridor',Math.min(98,base+6),'Higher-income household fit'],['Central access corridor',Math.min(96,base+2),'Balanced demand and visibility'],['Southeast value corridor',Math.max(55,base-5),'Lower-cost area to validate']];note.textContent='Ranked demographic prospects within an approximate 30-mile search radius of '+data.matchedAddress+' for a '+document.querySelector('#business').value+'. These are not verified vacant listings.';cards.innerHTML=areas.map(a=>'<article class="card"><strong>'+a[0]+'</strong><p>'+a[2]+'</p><div class="score">'+a[1]+' / 100</div></article>').join('');shortlist.classList.add('visible')}catch(error){result.textContent=error.message||'Unable to retrieve Census data. Please try again.'}});
</script></body></html>
